<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>jsOFD Playground</title>
    <style>
      /* Preview fonts — the same families the .ofd embeds, so the SVG
         preview renders like a real OFD reader (WYSIWYG). Relative URLs so
         the app works under any deployment sub-path. */
      @font-face {
        font-family: 'Noto Serif SC';
        src: url(fonts/NotoSerifSC-Regular.ttf) format('truetype');
        font-display: swap;
      }
      @font-face {
        font-family: 'Noto Sans SC';
        src: url(fonts/NotoSansSC-Regular.ttf) format('truetype');
        font-display: swap;
      }
      :root {
        --bg: #eef1f5;
        --surface: #ffffff;
        --surface-2: #f7f9fc;
        --border: #dfe5ee;
        --border-strong: #b9c3d2;
        --text: #141b26;
        --text-2: #46506000;
        --text-2: #46505f;
        --text-3: #6b7686;
        --accent: #2f5fe8;
        --accent-deep: #2349bd;
        --accent-soft: #e9efff;
        --ink: #1b2330;
        --ok: #17864f;
        --err: #d43c1a;
        --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        --sans:
          -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei',
          sans-serif;
        --r-lg: 14px;
        --r-md: 10px;
        --r-sm: 8px;
        --shadow: 0 1px 2px rgba(18, 28, 45, 0.07), 0 4px 16px rgba(18, 28, 45, 0.08);
        --shadow-lg: 0 2px 6px rgba(18, 28, 45, 0.14), 0 12px 34px rgba(18, 28, 45, 0.2);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font: 13px/1.5 var(--sans);
        color: var(--text);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea {
        font-family: inherit;
      }

      /* ---------- top bar ---------- */
      .topbar {
        height: 54px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        background: var(--ink);
        color: #fff;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        color: #fff;
        background: linear-gradient(135deg, #3b6ef5, #7aa0ff);
        display: grid;
        place-items: center;
        font: 700 11.5px var(--sans);
        letter-spacing: -0.3px;
      }
      .logo b {
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }
      .logo span {
        color: rgba(255, 255, 255, 0.55);
        font-size: 12.5px;
        margin-left: 2px;
      }
      .ver {
        font: 11px var(--mono);
        color: rgba(255, 255, 255, 0.75);
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 2px 9px;
      }
      .grow {
        flex: 1;
      }
      .hint {
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
      }
      kbd {
        font: 10.5px var(--mono);
        color: rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 5px;
        padding: 0 6px;
        margin: 0 1px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 16px;
        border-radius: var(--r-sm);
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.14s;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: #3b6ef5;
        color: #fff;
      }
      .btn.primary:hover {
        background: #4d7cf7;
      }
      .btn.primary:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .btn.ghost:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.5);
      }

      /* ---------- main split ---------- */
      .main {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      /* ---------- left workspace ---------- */
      .workspace {
        width: 440px;
        min-width: 380px;
        flex: none;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--border);
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 12px 16px 0;
      }
      .tab {
        padding: 9px 16px;
        border: none;
        background: var(--surface-2);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-3);
        border-radius: var(--r-sm) var(--r-sm) 0 0;
        border: 1px solid var(--border);
        border-bottom: none;
      }
      .tab:hover {
        color: var(--text-2);
      }
      .tab.on {
        color: var(--accent-deep);
        background: var(--accent-soft);
        border-color: #c9d8fd;
      }
      .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-top: 2px solid var(--accent);
      }
      .panel.hidden {
        display: none;
      }

      /* examples panel */
      .presets {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 12px 16px 4px;
      }
      .preset {
        display: flex;
        flex-direction: column;
        gap: 1px;
        text-align: left;
        padding: 9px 12px;
        border: 1px solid transparent;
        border-radius: var(--r-sm);
        background: none;
        cursor: pointer;
      }
      .preset:hover {
        background: var(--surface-2);
      }
      .preset.on {
        background: var(--accent-soft);
        border-color: #c8d8fd;
      }
      .preset b {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .preset.on b {
        color: var(--accent-deep);
      }
      .preset span {
        font-size: 11.5px;
        color: var(--text-3);
      }
      .editor {
        flex: 1;
        position: relative;
        margin: 10px 16px 14px;
        min-height: 0;
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        background: #fbfcfe;
        overflow: hidden;
      }
      .editor textarea {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        padding: 10px 14px;
        font: 12px/20px var(--mono);
        color: #232c3b;
        caret-color: var(--accent);
        tab-size: 2;
      }
      .editor:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(47, 95, 232, 0.12);
      }

      /* pdf panel */
      .pdf-panel {
        padding: 18px;
        gap: 14px;
        display: flex;
        flex-direction: column;
        overflow: auto;
      }
      .drop {
        border: 1.5px dashed var(--border-strong);
        border-radius: var(--r-lg);
        background: var(--surface-2);
        padding: 36px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .drop .big {
        font-size: 14.5px;
        font-weight: 600;
      }
      .drop .sub {
        color: var(--text-3);
        font-size: 12px;
        margin-top: 4px;
      }
      .file-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        background: var(--surface);
      }
      .file-chip .ic {
        width: 34px;
        height: 34px;
        border-radius: var(--r-sm);
        flex: none;
        background: var(--accent-soft);
        color: var(--accent-deep);
        display: grid;
        place-items: center;
        font: 700 10px var(--mono);
      }
      .file-chip .nm {
        font-weight: 600;
        font-size: 12.5px;
        word-break: break-all;
      }
      .file-chip .sz {
        color: var(--text-3);
        font: 11px var(--mono);
      }
      .pdf-actions {
        display: flex;
        gap: 8px;
      }
      .pdf-actions .btn.dark {
        flex: 1;
        justify-content: center;
      }
      .btn.dark {
        background: var(--accent);
        color: #fff;
      }
      .btn.dark:hover {
        background: var(--accent-deep);
      }
      .btn.dark:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn.soft {
        background: var(--surface-2);
        color: var(--text-2);
        border-color: var(--border-strong);
      }
      .btn.soft:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .pdf-note {
        color: var(--text-3);
        font-size: 12px;
        line-height: 1.7;
      }

      /* ---------- right preview ---------- */
      .preview {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        position: relative;
      }
      .pv-bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .pv-title {
        font-weight: 600;
        font-size: 13px;
      }
      .pv-doc {
        font: 11.5px var(--mono);
        color: var(--text-3);
        margin-left: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 30%;
      }
      .pv-scroll {
        flex: 1;
        overflow: auto;
        padding: 26px 24px 90px;
        display: flex;
        flex-direction: column;
        align-items: center;
        align-content: flex-start;
        background:
          radial-gradient(circle at 1px 1px, #c8d0dc 1px, transparent 0) 0 0 / 22px 22px,
          #e6eaf0;
        overscroll-behavior: contain;
      }
      .pv-empty {
        margin: auto;
        text-align: center;
        color: var(--text-3);
        font-size: 14px;
      }
      .page-slot {
        scroll-margin: 20px;
      }
      .page-tag {
        font: 11px var(--mono);
        color: #55606f;
        margin: 0 0 6px 2px;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
      }
      .page-gap {
        height: 22px;
      }
      .pv-scroll svg {
        display: block;
        background: #fff;
        border-radius: 4px;
        box-shadow:
          0 8px 28px rgba(16, 27, 45, 0.16),
          0 0 0 1px rgba(16, 27, 45, 0.07);
      }

      /* floating page navigator */
      .pager {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 2px;
        background: var(--ink);
        border-radius: 999px;
        padding: 5px;
        box-shadow: var(--shadow-lg);
        z-index: 10;
      }
      .pager button {
        width: 38px;
        height: 34px;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: #fff;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.12s;
      }
      .pager button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.18);
      }
      .pager button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .pager .indicator {
        min-width: 74px;
        text-align: center;
        color: #fff;
        font: 600 13px var(--mono);
        padding: 0 6px;
        user-select: none;
      }
      .pager .sep {
        width: 1px;
        height: 20px;
        background: rgba(255, 255, 255, 0.22);
        margin: 0 4px;
      }

      /* floating zoom control (top right of preview) */
      .zoomer {
        position: absolute;
        top: 14px;
        right: 18px;
        display: flex;
        align-items: center;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px;
        box-shadow: var(--shadow);
        z-index: 10;
      }
      .zoomer button {
        width: 32px;
        height: 30px;
        border: none;
        border-radius: 999px;
        background: transparent;
        color: var(--text-2);
        font-size: 15px;
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .zoomer button:hover {
        background: var(--accent-soft);
        color: var(--accent-deep);
      }
      .zoomer .pct {
        min-width: 52px;
        text-align: center;
        font: 600 12px var(--mono);
        color: var(--text);
      }

      /* ---------- bottom log ---------- */
      .logbar {
        flex: none;
        height: 32px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        background: #141922;
        color: #97a5b8;
        cursor: pointer;
        font: 11.5px var(--mono);
        user-select: none;
      }
      .logbar .arrow {
        transition: transform 0.15s;
      }
      .logbar.open .arrow {
        transform: rotate(90deg);
      }
      .log {
        display: none;
        height: 132px;
        overflow: auto;
        padding: 8px 16px;
        background: #141922;
        color: #a9bed4;
        font: 11.5px/1.8 var(--mono);
        white-space: pre-wrap;
        border-top: 1px solid #262d3a;
      }
      .log.open {
        display: block;
      }
      .log .ok {
        color: #5fcd8f;
      }
      .log .err {
        color: #ff857c;
      }
      .log .dim {
        color: #66707e;
      }

      ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }
      ::-webkit-scrollbar-thumb {
        background: #b9c2d0;
        border-radius: 6px;
        border: 2.5px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #97a2b2;
        background-clip: padding-box;
        border: 2.5px solid transparent;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="logo">
        <div class="logo-mark">OFD</div>
        <b>jsOFD</b><span>Playground</span>
      </div>
      <span class="ver" id="ver"></span>
      <div class="grow"></div>
      <span class="hint"><kbd>⌘</kbd><kbd>↵</kbd> 运行</span>
      <button class="btn primary" id="run">▸ 运行</button>
      <button class="btn ghost" id="download">⤓ 下载 .ofd</button>
    </header>

    <div class="main">
      <section class="workspace">
        <nav class="tabs">
          <button class="tab on" id="tab-examples">示例</button>
          <button class="tab" id="tab-pdf">PDF 转换</button>
        </nav>

        <div class="panel" id="panel-examples">
          <div class="presets" id="presets"></div>
          <div class="editor">
            <textarea id="code" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="panel hidden" id="panel-pdf">
          <div class="pdf-panel">
            <div class="drop" id="drop">
              <div class="big">拖入 PDF 文件，或点击选择</div>
              <div class="sub">转换后可在右侧预览并下载 .ofd</div>
              <input type="file" id="pdfFile" accept="application/pdf" hidden />
            </div>
            <div class="file-chip" id="fileChip" style="display: none">
              <div class="ic">PDF</div>
              <div style="flex: 1; min-width: 0">
                <div class="nm" id="fileName"></div>
                <div class="sz" id="fileSize"></div>
              </div>
            </div>
            <div class="pdf-actions">
              <button class="btn dark" id="convert" disabled>▸ 转换为 OFD</button>
              <button class="btn soft" id="clearFile" style="display: none">清除</button>
            </div>
            <div class="pdf-note">
              转换保留：文本（逐字真实步进）、矢量图形、位图、透明度、多页与页面旋转。<br />
              不转换：混合模式、图案渐变、Type3 字体、注释。
            </div>
          </div>
        </div>
      </section>

      <section class="preview">
        <div class="pv-bar">
          <span class="pv-title">预览</span>
          <span class="pv-doc" id="docInfo"></span>
          <span class="grow"></span>
        </div>
        <div class="pv-scroll" id="pvScroll" tabindex="0">
          <div class="pv-empty" id="pvEmpty">运行示例或转换 PDF 后在此预览</div>
        </div>

        <div class="zoomer">
          <button id="zoomOut" title="缩小">−</button>
          <span class="pct" id="zoomPct">适应</span>
          <button id="zoomIn" title="放大">+</button>
          <button
            id="zoomFit"
            title="适应宽度"
            style="width: auto; padding: 0 10px; font-size: 11.5px; font-weight: 600"
          >
            适应宽度
          </button>
        </div>

        <div class="pager">
          <button id="pgPrev" title="上一页（↑）">‹</button>
          <span class="indicator" id="pageInfo">– / –</span>
          <button id="pgNext" title="下一页（↓）">›</button>
          <span class="sep"></span>
          <span
            class="indicator"
            id="objInfo"
            style="min-width: 0; font-weight: 400; font-size: 11.5px; opacity: 0.75"
          ></span>
        </div>
      </section>
    </div>

    <div class="logbar" id="logbar">
      <span class="arrow">›</span><span>运行日志</span> <span class="grow"></span
      ><span id="logCount"></span>
    </div>
    <div class="log" id="log"></div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
